<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>CalcS</title>
    </head>
    <body>
        <div class="container">
            <div class="container-wrapper">
                <div class="input-section inner-contain">
                    <span class="typed-key">0</span>
                </div>
                <div class="display-section inner-contain">
                    <span class="display-result">0</span>
                </div>
                <div class="buttons-section grid-wrapper">
                    <input type="button" value="7" class="key" />
                    <input type="button" value="8" class="key" />
                    <input type="button" value="9" class="key" />
                    <input type="button" value="×" class="key ops" />
                    <input type="button" value="4" class="key" />
                    <input type="button" value="5" class="key" />
                    <input type="button" value="6" class="key" />
                    <input type="button" value="-" class="key ops" />
                    <input type="button" value="1" class="key" />
                    <input type="button" value="2" class="key" />
                    <input type="button" value="3" class="key" />
                    <input type="button" value="+" class="key ops" />
                    <input type="button" value="CE" class="key ops-ce" />
                    <input type="button" value="0" class="key" />
                    <input type="button" value="=" class="key ops-equal" />
                    <input type="button" value="÷" class="key ops" />
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
